<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring AI Chat (Typing Effect)</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
    textarea { width: 100%; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; margin-top: 10px; font-size: 16px; }
    #response { margin-top: 20px; white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 5px; min-height: 50px; }
  </style>
</head>
<body>

  <h1>Spring AI Chat</h1>

  <form id="aiForm">
    <textarea id="query" rows="5" placeholder="Enter your query here..."></textarea><br>
    <button type="submit">Send</button>
  </form>

  <div id="response"></div>

  <script>
    const form = document.getElementById('aiForm');
    const queryInput = document.getElementById('query');
    const responseDiv = document.getElementById('response');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = encodeURIComponent(queryInput.value.trim());
      if (!query) return;

      responseDiv.textContent = ""; // Clear previous response
      responseDiv.textContent = "Loading...";

      try {
        const res = await fetch(`http://localhost:9091/api/v1.1/chat/?query=${query}`);
        if (!res.ok) throw new Error('Network response was not ok');

        const text = await res.text(); // Plain text response

        responseDiv.textContent = ""; // Clear "Loading..."
        // Display text in chunks
        let i = 0;
        const speed = 20; // milliseconds per character

        function typeChunk() {
          if (i < text.length) {
            responseDiv.textContent += text.charAt(i);
            i++;
            setTimeout(typeChunk, speed);
          }
        }
        typeChunk();

      } catch (err) {
        responseDiv.textContent = 'Error: ' + err.message;
      }
    });
  </script>

</body>
</html>
